name: WildcatGames
options:
  bundleIdPrefix: com.thebench
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WildcatRadioCore:
    path: ../wildcat-radio-core
settings:
  base:
    DEVELOPMENT_TEAM: CC8X33MU92
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WildcatGames:
    type: application
    platform: iOS
    sources:
      - path: WildcatGames
      - path: Shared
    dependencies:
      - package: WildcatRadioCore
      - target: WildcatWidgets
        embed: true
      # Reticulum spike: CPython 3.13 for iOS (BeeWare Python-Apple-support), fetched by
      # tools/reticulum/fetch.sh into the gitignored Reticulum/vendor/.
      - framework: Reticulum/vendor/python-support/Python.xcframework
        embed: true
    postBuildScripts:
      # The standard library, Wildcat's Python glue and the Reticulum packages into the bundle,
      # binary modules as signed frameworks (BeeWare's build/utils.sh).
      - name: Install Python and Reticulum
        shell: /bin/bash
        script: '"$PROJECT_DIR/tools/reticulum/install-python.sh"'
        basedOnDependencyAnalysis: false
      - name: Files app sharing in Debug builds only
        shell: /bin/sh
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$plist" 2>/dev/null || true
          fi
        basedOnDependencyAnalysis: false
    info:
      path: WildcatGames/Info.plist
      properties:
        # The Den is a home server reached by address over Tailscale, usually plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Wildcat talks to your Den, or to a Reticulum node you add, on your home network or tailnet."
        UIBackgroundModes:
          - bluetooth-central
        # No ITSAppUsesNonExemptEncryption key, on purpose. The app carries OpenSSL (in the embedded Python) and
        # Reticulum encrypts messages end to end with it, so `false` would be untrue; and `true` without an
        # Apple-issued ITSEncryptionExportComplianceCode is refused at upload (ITMS-90592, 2026-11-21). With the key
        # absent App Store Connect asks the encryption questions for each build and Seth answers them there:
        # yes; standard algorithms; not exempt. If Apple issues a code, add both keys together.
        # See docs/RETICULUM_LICENSING.md ("Export compliance").
        # Documents (rnode-ble.log, walks, saved messages) show in the Files app and can be pulled
        # with devicectl (tools/rnode-diag.sh). Debug builds only: the build phase below takes both
        # keys out of every other configuration, so a TestFlight or App Store build keeps them private.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.thebench.wildcatgames
            CFBundleURLSchemes:
              - wildcat
        NSCameraUsageDescription: "Scan QR codes to join Meshtastic and MeshCore channels and fox hunts."
        NSLocationWhenInUseUsageDescription: "Wildcat uses your location for Fox Hunt, Daily Fox, Territory, Geo Gifts and coverage walks, and to set your node's position when you ask (your node then broadcasts it)."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebench.wildcatgames
        # App Group shared with the widgets (WildcatSnapshot).
        CODE_SIGN_ENTITLEMENTS: WildcatGames/WildcatGames.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wildcat Mesh
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Wildcat connects to your own Meshtastic, MeshCore and RNode radios over Bluetooth to send and receive messages, play games, and bridge Meshtastic and MeshCore."
        # Reticulum spike: the embedded Python's C glue (WildcatGames/Reticulum/Python).
        SWIFT_OBJC_BRIDGING_HEADER: WildcatGames/Reticulum/WildcatGames-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        # install-python.sh writes the runtime into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The embedded Python's binary packages for the simulator are arm64 only (Apple silicon Macs).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  WildcatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WildcatWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebench.wildcatgames.widgets
        CODE_SIGN_ENTITLEMENTS: WildcatWidgets/WildcatWidgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Wildcat Mesh
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: WildcatWidgets/Info.plist
      properties:
        CFBundleDisplayName: Wildcat Mesh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WildcatGamesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WildcatGamesTests
    dependencies:
      - target: WildcatGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebench.wildcatgames.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WildcatGames:
    build:
      targets:
        WildcatGames: all
        WildcatGamesTests: [test]
    test:
      targets:
        - WildcatGamesTests
